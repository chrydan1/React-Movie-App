      x2="52"
      y2="54"
    >
      <stop offset="0%" stop-color="#00cfff"/>
      <stop offset="35%" stop-color="#00cfff"/>
      <stop offset="50%" stop-color="#8a4dff"/>
      <stop offset="65%" stop-color="#ff00b8"/>
